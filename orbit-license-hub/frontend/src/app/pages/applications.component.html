<section class="panel">
  <h2>Applicazioni</h2>
  <div class="toolbar">
    <input [(ngModel)]="search" placeholder="Filtro applicazione" />
    <select [(ngModel)]="sort">
      <option value="name,asc">Nome A-Z</option>
      <option value="name,desc">Nome Z-A</option>
      <option value="id,desc">Piu recenti</option>
    </select>
    <input type="number" [(ngModel)]="tenantFilter" placeholder="Tenant ID" />
    <button type="button" (click)="load()">Cerca</button>
    <button type="button" (click)="openCreate()">Nuova applicazione</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tenant</th>
        <th>Nome</th>
        <th>Ambiente</th>
        <th>Licenze</th>
        <th>Stato</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.id }}</td>
        <td>{{ item.tenantId }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.environment }}</td>
        <td>{{ item.allocatedLicenses }}</td>
        <td>{{ item.status }}</td>
        <td class="actions">
          <button type="button" (click)="edit(item)">Modifica</button>
          <button type="button" *ngIf="item.status === 'ACTIVE'" (click)="disable(item)">Disabilita</button>
          <button type="button" *ngIf="item.status === 'DISABLED'" (click)="enable(item)">Abilita</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="modal-backdrop" *ngIf="showForm">
    <div class="modal-card">
      <div class="modal-header">
        <h3>{{ editingId ? 'Modifica applicazione' : 'Nuova applicazione' }}</h3>
        <button type="button" class="icon" (click)="closeForm()">X</button>
      </div>

      <form class="form-grid" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          Tenant ID
          <input type="number" formControlName="tenantId" />
        </label>
        <label>
          Nome
          <input type="text" formControlName="name" />
        </label>
        <label>
          Logo URL
          <input type="text" formControlName="logoUrl" />
        </label>
        <label>
          Colore base
          <input type="color" formControlName="baseColor" />
        </label>
        <label>
          Ambiente
          <select formControlName="environment" [disabled]="editingId !== null">
            <option value="DEV">DEV</option>
            <option value="PROD">PROD</option>
          </select>
        </label>
        <label>
          P12 riferimento file
          <input type="text" formControlName="p12FileRef" />
        </label>
        <label>
          Password P12
          <input type="password" formControlName="p12Password" />
        </label>
        <label>
          Retention (min)
          <input type="number" formControlName="retentionMinutes" />
        </label>
        <label>
          Licenze allocate
          <input type="number" formControlName="allocatedLicenses" />
        </label>
        <label class="full">
          Public key PEM
          <textarea rows="4" formControlName="publicKeyPem"></textarea>
        </label>
        <div class="actions">
          <button type="submit">Salva</button>
          <button type="button" (click)="closeForm()">Annulla</button>
        </div>
      </form>
    </div>
  </div>
</section>
