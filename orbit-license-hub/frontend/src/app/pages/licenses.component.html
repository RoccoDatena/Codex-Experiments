<section class="panel">
  <h2>Licenze</h2>
  <div class="toolbar">
    <input [(ngModel)]="search" placeholder="Filtro per device o id" />
    <select [(ngModel)]="sort">
      <option value="id,desc">Piu recenti</option>
      <option value="id,asc">Piu vecchie</option>
      <option value="deviceCode,asc">Device A-Z</option>
    </select>
    <input type="number" [(ngModel)]="tenantFilter" placeholder="Tenant ID" />
    <button type="button" (click)="load()">Cerca</button>
    <button type="button" (click)="openCreate()">Assegna licenza</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Tenant</th>
        <th>App</th>
        <th>Device</th>
        <th>Stato</th>
        <th>Ultimo uso</th>
        <th>Azioni</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.id }}</td>
        <td>{{ item.tenantId }}</td>
        <td>{{ item.applicationId }}</td>
        <td>{{ item.deviceCode }}</td>
        <td>{{ item.status }}</td>
        <td>{{ item.lastUsedAt || '-' }}</td>
        <td class="actions">
          <button type="button" (click)="deassign(item)" [disabled]="item.status !== 'ASSIGNED'">De-assegna</button>
          <button type="button" (click)="release(item)">Libera</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="modal-backdrop" *ngIf="showForm">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Assegna licenza</h3>
        <button type="button" class="icon" (click)="closeForm()">X</button>
      </div>

      <form class="form-grid" [formGroup]="form" (ngSubmit)="assign()">
        <label>
          Tenant ID
          <input type="number" formControlName="tenantId" />
        </label>
        <label>
          Application ID
          <input type="number" formControlName="applicationId" />
        </label>
        <label>
          Device code
          <input type="text" formControlName="deviceCode" />
        </label>
        <div class="actions">
          <button type="submit">Assegna</button>
          <button type="button" (click)="closeForm()">Annulla</button>
        </div>
      </form>
    </div>
  </div>
</section>
